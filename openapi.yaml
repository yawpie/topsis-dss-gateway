      tags:
        - 'TOPSIS data '
      description: >-
        ## Delete Criteria Bulk


        Deletes multiple criteria at once by their names. This is useful for
        removing several criteria in a single request instead of deleting them
        one by one.


        ---


        ### Method & URL


        ```

        DELETE {{BASE_URL}}/criteria/bulk

        ```


        ---


        ### Request Body


        **Content-Type:** `application/json`


        | Field   | Type            | Required |
        Description                                      |

        |---------|-----------------|----------|--------------------------------------------------|

        | `names` | `array<string>` | ✅ Yes   | A list of criteria names to be
        deleted.          |


        **Example:**


        ```json

        {
            "names": [
                "ipk",
                "semester",
                "penghasilan_ortu",
                "jumlah_tanggungan",
                "keaktifan_organisasi",
                "skor_prestasi"
            ]
        }

        ```


        ---


        ### Responses


        #### ✅ 200 — Success


        All specified criteria were found and successfully deleted.


        ---


        #### ❌ 404 — Not Found


        None of the specified criteria were deleted. This typically means none
        of the provided names exist in the database.


        ```json

        {
            "message": "No criteria were deleted. Please check the names and try again. (maybe they don't exist)",
            "error": {
                "name": "HttpError",
                "status": 404
            }
        }

        ```


        ---


        ### Notes


        - The `names` array must contain at least one entry.

        - If **none** of the provided names match existing criteria, a `404`
        response is returned.

        - Criteria names are case-sensitive — make sure the names match exactly
        as stored in the database.

        - This endpoint performs a bulk operation; partial deletions (where only
        some names match) may or may not be supported depending on the server
        implementation — verify behavior with the backend if needed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  type: array
                  items:
                    type: string
            example:
              names:
                - ipk
                - semester
                - penghasilan_ortu
                - jumlah_tanggungan
                - keaktifan_organisasi
                - skor_prestasi
